# Local dev mirror only. Production is a cloud-managed platform (ADR-0003).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epmos
      POSTGRES_PASSWORD: epmos
      POSTGRES_DB: epmos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epmos -d epmos']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
