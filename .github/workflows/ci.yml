# The gates, run on every push and every pull request (ADR-0052).
#
# Four of them gate what this repository wrote; the fifth, since issue #107,
# gates what it pinned — `apps/api/tools/` is a submodule of the helpers' own
# repository, and a bad commit moved into it is a wrong number on a drawing
# rather than a red typecheck.
#
# Until this file there was no CI: ADR-0045 recorded it, and every gate ran
# when someone remembered to run it. Three post-MVP defects reached the machine
# that serves before anyone did.
#
# It gates and does **not** deploy. ADR-0045 chose one machine with a mounted
# volume, so a deploy on every green merge is a migration on every green merge,
# and that is a second decision ADR-0052 deliberately did not take. Its named
# trigger for taking it: the first deploy that is late because a person was.
name: Gates

on:
  push:
  pull_request:

permissions:
  contents: read

# A branch pushed twice in a minute is one branch. The older run is answering a
# question nobody is waiting for.
#
# Keyed on `head_ref` where there is one, because `github.ref` is
# `refs/heads/<branch>` on a push and `refs/pull/N/merge` on a pull request:
# keyed on that, a branch with a PR open runs every gate twice and neither run
# cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # `submodules: true`, for `apps/api/tools/` — the helpers' repository,
      # pinned by commit (ADR-0053). Without it the registry reads an empty
      # directory, registers nothing, and every helper test in the suite fails
      # on an absence rather than on anything either repository wrote.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The helpers' repository is **private**, and the default
          # `GITHUB_TOKEN` is scoped to this repository alone — so it checks
          # this one out and then fails on the submodule. `HELPERS_READ_TOKEN`
          # is a fine-grained personal access token with read access to
          # `augustov58/electrical-helpers`; `actions/checkout` uses whatever
          # token it is given for the submodules too. The fallback is what
          # keeps a fork, or a clone before the secret exists, failing on the
          # submodule with a sentence rather than on this line with none.
          token: ${{ secrets.HELPERS_READ_TOKEN || github.token }}

      # `corepack`, as the Dockerfile does, so the pnpm that runs here is the
      # one `packageManager` names and not whatever the runner image ships.
      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Chrome's **default** sandbox, which ADR-0035 keeps rather than passing
      # `--no-sandbox`, needs an unprivileged user namespace. Ubuntu restricts
      # those through AppArmor, so a report test would fail here for the same
      # class of reason it needs `seccomp=unconfined` under Docker locally
      # (ADR-0045). The machine that serves applies neither filter: Fly's
      # Firecracker VMs have no such profile, and `scripts/chrome-probe.sh` is
      # what proves the sandbox holds there. This line is about the runner and
      # says nothing about production.
      - name: Let Chrome open its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Chrome lives in `~/.cache/puppeteer`, **outside** the pnpm store, so it
      # needs a cache of its own. Keyed on the lockfile, which is what pins the
      # puppeteer version that decides the build.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--frozen-lockfile`: a lockfile a dependency edit forgot is a red gate
      # and not a silently different install. This also runs `prisma generate`.
      - run: pnpm install --frozen-lockfile

      # Not redundant, and the third CI run is why. A **warm pnpm store** links
      # puppeteer without re-running its install script, and that script is what
      # downloads Chrome — so a hit on the store cache with a miss here is an
      # install that exits 0 with no browser, and twelve report tests failing on
      # a vendor's absence rather than on anything this repo wrote. It is the
      # same shape as the Dockerfile's missing-`unzip` note: Chrome absent,
      # install exits 0. Idempotent — on a cache hit it prints the path it
      # already has.
      - name: Make sure Chrome is actually there
        run: pnpm --filter api exec puppeteer browsers install chrome

      - name: Typecheck
        run: pnpm typecheck

      # The root command and not `--filter api` plus `--filter web`, so a
      # package added in a later slice is gated without anybody remembering —
      # the argument `gate.md` makes for sweeping every registered route and
      # `test/sources.ts` for walking the tree. It is also the command AGENTS.md
      # documents, which is the one issue #49 found had rotted while nothing ran
      # it. Two of ADR-0052's four gates, in one step: `pnpm -r test` prefixes
      # each package's output with its name, so a red run still says which.
      #
      # The API half starts its own PostgreSQL 16 and Redis 7 through
      # Testcontainers and migrates a template database with the same
      # `prisma migrate deploy` production deploys, so there is no `services:`
      # block above: one would sit unread beside the containers the suite
      # starts anyway. Real Postgres and real Redis either way, which is what
      # ADR-0052 asked for.
      - name: Both suites
        run: pnpm test

      # The fourth gate, and the only one that compiles the stylesheet or reads
      # a route's generated types — which is why ADR-0049 keeps it outside
      # `pnpm test` and `.claude/rules/web.md` has asked for it by hand until
      # now. It needs nothing passed to it since issue #105.
      - name: Web build
        run: pnpm --filter web build

      # The fifth gate: each helper's own test command, named by its manifest
      # and run from its own directory. `ubuntu-latest` ships Python 3, which
      # is the only thing these need — no pip, no requirements file.
      - name: The helpers' own tests
        run: ./scripts/helper-tests.sh
