# The deployment ADR-0003 asked for, and issue #22's gate is what makes it safe
# to have one (issue #56).

app = "epmos-t1"
primary_region = "iad"

[build]

[env]
  # Production, which is what makes the session cookie `secure` — over plain
  # HTTP a secure cookie is never sent back, and a deployment is behind TLS
  # (ADR-0003). There is no committed secret for either half to refuse any
  # more: the gate is a session belonging to a person (ADR-0055).
  NODE_ENV = "production"

  # The object store is a directory on the volume mounted below. The
  # S3-compatible adapter is still unwritten and the vendor pick (S3 vs R2 vs
  # B2) is still open; a Fly volume is a real disk, so the pick stays deferred
  # rather than being forced by the deployment.
  OBJECT_STORE_DIR = "/data/objects"

  # Where the Pi SDK keeps the model provider's credential. On the volume, and
  # not at its default of `$HOME/.pi/agent`, because $HOME is inside the image
  # and the image is replaced by every deploy — a credential left at the default
  # would be authenticated once and gone by the next one.
  #
  # This product reads nothing from here. ADR-0040 put provider auth in the
  # SDK's own `ModelRuntime`, and ADR-0041 removed the agent's file tools
  # entirely after finding `cwd` never bounded them — so the agent cannot read
  # this directory either, which is the point.
  PI_CODING_AGENT_DIR = "/data/pi-agent"

  # Postgres on Fly has no TLS on the private network: 6PN is WireGuard-encrypted
  # end to end, and the Managed cluster's pgbouncer closed a TLS handshake with
  # `P1011: unexpected EOF`. `scripts/start.sh` appends this to DATABASE_URL, so
  # the credential itself never encodes a transport choice and changing it never
  # means rewriting a secret.
  #
  # Since the swap to the unmanaged cluster (ADR-0045, 2026-09-05) this is a
  # **no-op in practice**: `fly postgres attach` writes `?sslmode=disable` into
  # the URL itself, and the script only appends when the URL carries none. It is
  # kept rather than deleted because it is what makes a deployment survive a
  # DATABASE_URL that does not carry one.
  DATABASE_SSLMODE = "disable"

  # The API listens on loopback inside the machine and nothing outside it can
  # reach that port. Every call is made by the Next server (ADR-0020), which is
  # the same arrangement `pnpm dev` has and the reason ADR-0032 refused a
  # presigned URL.
  API_PORT = "3001"
  NEXT_PUBLIC_API_URL = "http://127.0.0.1:3001"

  # The memory agent's adapter. Off by default and named here deliberately:
  # `unconfiguredAgentRunService` refuses and says so, which is the posture
  # every vendor port in this product takes (ADR-0040), and this is the one
  # place that posture is lifted.
  #
  # `AGENT` belongs in the deployment config because it is a real setting the
  # author chose rather than a fixture. What it turns on: a memory run sends the
  # project's curated prose to a model provider. Not client documents; ADR-0041
  # removed the agent's file tools entirely, so it reads nothing off this disk.
  AGENT = "pi"
  # Which model every run uses, as `<provider>/<model>`, chosen by the author on
  # 2026-09-23 (issue #157, ADR-0065) from the plan on the machine's Pi account.
  # Required with `AGENT=pi`: left to the SDK, the model was whichever
  # credentialed provider came first in its own table, which ran
  # `kimi-coding/kimi-for-coding` here while the Pi settings named another. A
  # model the account does not have fails the run and is never swapped for one.
  # A smaller window than 1,048,576 tokens re-derives ADR-0063's text bound.
  #
  # `alibaba-plan/deepseek-v4.1-flash` was the first choice and refused every
  # call: this plan's endpoint rejects the `developer` role the SDK sends a
  # reasoning model, and the SDK only knows DeepSeek lacks it on DeepSeek's own
  # endpoint (issue #162). Qwen 3.8 Flash on the same plan answered a stand-in
  # chat turn through its tool on the machine before it was chosen. Check any
  # new model the same way before naming it here.
  AGENT_MODEL = "alibaba-plan/qwen3.8-flash"

  # The two vendor adapters, on since 2026-09-14 (issue #109, ADR-0060 and
  # ADR-0061). This comment said they were set **nowhere** until then, and that
  # sentence was the employer-consent gate for four narrowings of it — spent
  # now that consent landed on 2026-09-08 and both adapters are written.
  #
  # What still holds the line is not this file: `unconfiguredOcrProvider` and
  # `unconfiguredTranscriber` are what a deployment gets by default and what an
  # unrecognised vendor name falls through to, and the two processing-location
  # gates are unchanged — the extraction create routes refuse the ask on a
  # `LOCAL` project, and the worker reads the setting again before any bytes are
  # fetched, which is what bounds a job already in Redis when consent is
  # withdrawn.
  #
  # Both credentials are Fly secrets and appear in no file here. Both adapters
  # reach the **same** Azure resource — one Foundry resource serves Document
  # Intelligence and Speech alike — but stay two independent variable pairs, so
  # either vendor can be repointed without touching the other. The host is
  # `services.ai.azure.com` and **not** the `cognitiveservices.azure.com` the
  # vendor's own REST docs give; that correction is recorded in both ADRs, and
  # `scripts/check-vendors.sh` is what proves it for a given deployment.
  OCR = "azure"
  TRANSCRIBER = "azure"

  # `INBOUND_MAIL` is still set nowhere, and that sentence is still load-bearing
  # for the one port that has no adapter: ADR-0042 priced an inbound-parse
  # provider as the stronger consent case of the three — it would hold the whole
  # of every forwarded message — and nobody has been asked.

[[mounts]]
  source = "epmos_data"
  destination = "/data"

[http_service]
  # Next, not the API. The one listener the internet can see is the one the
  # gate sits in front of.
  internal_port = 3000
  force_https = true
  # The machine stays up. It suspended when idle until 2026-09-05, which cost
  # nothing and was wrong for this product in three ways: a cold first request
  # took about thirty seconds, `fly ssh console` simply refuses to reach a
  # stopped machine — so every administrative task began by curling a page to
  # wake it — and the BullMQ worker lives inside this process, so transcription
  # and report rendering only advance while somebody is holding the page open.
  auto_stop_machines = "off"
  auto_start_machines = true
  # One machine, and never more: the volume above can be mounted by exactly one,
  # and `photos.taken_at` binning plus the BullMQ worker both assume one writer.
  # Now also never fewer, which is the whole of the change above.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    # `/healthz` and not `/v1/health`: the gate covers the health route with
    # everything else, deliberately, so a platform check would have to carry a
    # session and this one has none. `/healthz` is a route of the Next server
    # that calls the API through the one door and answers 503 when nothing
    # answers it — so the check watches the process it is a check on, which is
    # ADR-0052's sixth point and closes issue #94.
    #
    # It replaces `/sign-in`, which this checked between issues #105 and #106,
    # and `/unlock` before that. Both were served entirely by Next and proved
    # only that Next was serving: an API that was OOM-killed or wedged left
    # this check green and the machine never restarted.
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # Chrome needs room to lay out a report. 512mb was not enough to launch it.
  memory = "1gb"
